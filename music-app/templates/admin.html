{% extends "base.html" %}
{% block title %}Admin — SlowBuild Music{% endblock %}
{% block content %}
<style>
.admin-wrap{max-width:1200px;margin:0 auto}
.admin-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin:20px 0 24px}
.admin-header h1{margin:0;font-size:1.5rem}
.stats{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 20px;min-width:120px}
.stat-card .num{font-size:1.6rem;font-weight:700;color:var(--teal)}
.stat-card .label{font-size:.75rem;color:var(--muted);margin-top:2px}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar input,.toolbar select{padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:.85rem;outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:var(--teal)}
.toolbar input{min-width:280px}
.btn{padding:8px 18px;border-radius:8px;border:none;font-size:.85rem;cursor:pointer;font-weight:600;transition:all .15s}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn-primary{background:var(--teal);color:#000}
.btn-success{background:#22c55e;color:#000}
.btn-danger{background:#ef4444;color:#fff}
.btn-sm{padding:4px 10px;font-size:.72rem;border-radius:6px}
.song-table{width:100%;border-collapse:collapse;font-size:.85rem}
.song-table th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--border);color:var(--muted);font-weight:600;font-size:.75rem;position:sticky;top:0;background:var(--bg);z-index:1}
.song-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.song-table tr:hover td{background:rgba(56,189,248,.03)}
.song-table .title-cell{font-weight:600;cursor:pointer}
.song-table .title-cell:hover{color:var(--teal)}
.song-table .artist-cell{color:var(--pink)}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.68rem}
.badge-ok{background:rgba(34,197,94,.15);color:#22c55e}
.badge-miss{background:rgba(239,68,68,.1);color:#ef4444}
.badge-warn{background:rgba(234,179,8,.15);color:#eab308}
.badge-tag{background:rgba(56,189,248,.1);color:var(--teal)}

/* 编辑弹窗 */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;max-width:720px;width:95%;max-height:85vh;overflow-y:auto}
.modal h2{margin:0 0 20px;font-size:1.2rem}
.modal .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.modal .form-group{display:flex;flex-direction:column;gap:4px}
.modal .form-group.full{grid-column:1/-1}
.modal label{font-size:.78rem;color:var(--muted);font-weight:600}
.modal input,.modal textarea,.modal select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.85rem;font-family:inherit;resize:vertical}
.modal textarea{min-height:80px}
.modal input:focus,.modal textarea:focus{border-color:var(--teal);outline:none}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.empty-state{text-align:center;padding:60px;color:var(--muted)}
@media(max-width:768px){.song-table{font-size:.75rem}.song-table th,.song-table td{padding:8px 6px}}
</style>

<div class="admin-wrap">
<div class="admin-header">
  <h1>🎵 音乐管理后台</h1>
  <div style="display:flex;gap:8px">
    <button class="btn btn-primary" onclick="openAdd()">+ 新增歌曲</button>
    <a href="/admin/login" style="font-size:.7rem;color:var(--muted);align-self:center">退出</a>
  </div>
</div>

<div class="stats" id="stats"></div>

<div class="toolbar">
  <input id="searchInput" placeholder="🔍 搜索歌名/歌手..." oninput="renderTable()">
  <select id="genreFilter" onchange="renderTable()">
    <option value="">全部风格</option>
  </select>
  <select id="tagFilter" onchange="renderTable()">
    <option value="">全部标签</option>
  </select>
  <select id="statusFilter" onchange="renderTable()">
    <option value="">全部状态</option>
    <option value="has_yt">✅ 有YouTube</option>
    <option value="no_yt">❌ 缺YouTube</option>
    <option value="has_review">📝 有乐评</option>
    <option value="no_review">📝 缺乐评</option>
  </select>
  <span style="font-size:.78rem;color:var(--muted)" id="resultCount"></span>
</div>

<table class="song-table">
<thead><tr>
  <th style="width:30%">歌曲</th>
  <th>风格</th>
  <th>状态</th>
  <th style="width:100px">操作</th>
</tr></thead>
<tbody id="songTableBody"></tbody>
</table>
<div class="empty-state" id="emptyState" style="display:none">没有匹配的歌曲</div>
</div>

<!-- 编辑弹窗 -->
<div class="modal-overlay" id="editModal">
<div class="modal">
  <h2 id="modalTitle">编辑歌曲</h2>
  <form id="editForm" onsubmit="saveSong(event)">
    <input type="hidden" name="song_id" id="editSongId">
    <div class="form-grid">
      <div class="form-group"><label>中文歌名 *</label><input name="title" required></div>
      <div class="form-group"><label>歌手 *</label><input name="artist" required></div>
      <div class="form-group"><label>英文歌名</label><input name="title_en"></div>
      <div class="form-group"><label>风格</label><input name="genre" placeholder="pop/rock/folk/indie..."></div>
      <div class="form-group"><label>年份</label><input name="year" placeholder="2023"></div>
      <div class="form-group"><label>语言</label><select name="language"><option value="zh">普通话</option><option value="yue">粤语</option><option value="nan">闽南语</option></select></div>
      <div class="form-group"><label>🎬 YouTube ID</label><input name="youtube_id" placeholder="e.g. dQw4w9WgXcQ"></div>
      <div class="form-group"><label>🎧 Spotify ID</label><input name="spotify_id" placeholder="track ID"></div>
      <div class="form-group"><label>🎵 网易云 ID</label><input name="netease_id" placeholder="e.g. 186016"></div>
      <div class="form-group"><label>📁 自托管 MP3 URL</label><input name="direct_audio_url" placeholder="https://..."></div>
      <div class="form-group"><label>🖼️ 封面图 URL</label><input name="cover" placeholder="https://..."></div>
      <div class="form-group"><label>🏷️ 标签 (逗号分隔)</label><input name="tags" placeholder="pop, viral, youth"></div>
      <div class="form-group full"><label>📝 英文乐评</label><textarea name="review_en" rows="4" placeholder="150-250 word English music review..."></textarea></div>
      <div class="form-group full"><label>📝 中文乐评</label><textarea name="review_cn" rows="2" placeholder="50-100字中文简短乐评"></textarea></div>
      <div class="form-group full"><label>🎤 歌词原文 (每行一句)</label><textarea name="lyrics_original" rows="3" placeholder="歌词原文..."></textarea></div>
      <div class="form-group full"><label>🎤 歌词英文翻译</label><textarea name="lyrics_translation_en" rows="3" placeholder="English translation..."></textarea></div>
      <div class="form-group full"><label>💬 歌词文化注解 (英文)</label><textarea name="lyrics_translation_cn_note" rows="2" placeholder="Language/cultural notes..."></textarea></div>
      <div class="form-group full"><label>🏮 文化背景 (英文, 100-150字)</label><textarea name="cultural_note" rows="4" placeholder="Cultural context for foreign listeners..."></textarea></div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn" onclick="closeModal()" style="background:var(--border);color:var(--text)">取消</button>
      <button type="button" class="btn btn-danger btn-sm" id="deleteBtn" style="display:none" onclick="deleteSong()">🗑 删除</button>
      <button type="submit" class="btn btn-primary">💾 保存</button>
    </div>
  </form>
</div>
</div>

<script>
var allSongs = {{ songs|tojson }};
var allGenres = [...new Set(allSongs.map(s=>s.genre).filter(Boolean))].sort();
var allTags = [...new Set(allSongs.flatMap(s=>s.tags||[]).filter(Boolean))].sort();

// 初始化
(function init(){
  // 填充筛选器
  var gf = document.getElementById('genreFilter');
  allGenres.forEach(g => { var o = document.createElement('option'); o.value=g; o.textContent=g; gf.appendChild(o); });
  var tf = document.getElementById('tagFilter');
  allTags.forEach(t => { var o = document.createElement('option'); o.value=t; o.textContent=t; tf.appendChild(o); });
  // 统计
  updateStats();
  renderTable();
})();

function updateStats(){
  var total = allSongs.length;
  var hasYT = allSongs.filter(s=>s.youtube_id).length;
  var hasReview = allSongs.filter(s=>s.review_en&&s.review_en.length>50).length;
  var hasCover = allSongs.filter(s=>s.cover).length;
  document.getElementById('stats').innerHTML = 
    '<div class="stat-card"><div class="num">'+total+'</div><div class="label">总歌曲</div></div>'+
    '<div class="stat-card"><div class="num" style="color:#22c55e">'+hasYT+'</div><div class="label">有YouTube</div></div>'+
    '<div class="stat-card"><div class="num" style="color:var(--gold)">'+hasReview+'</div><div class="label">有乐评</div></div>'+
    '<div class="stat-card"><div class="num">'+hasCover+'</div><div class="label">有封面</div></div>';
}

function getFiltered(){
  var q = (document.getElementById('searchInput').value||'').toLowerCase();
  var gf = document.getElementById('genreFilter').value;
  var tf = document.getElementById('tagFilter').value;
  var sf = document.getElementById('statusFilter').value;
  return allSongs.filter(s=>{
    if (q && !(s.title+s.artist+s.title_en+(s.review_en||'')).toLowerCase().includes(q)) return false;
    if (gf && s.genre !== gf) return false;
    if (tf && !(s.tags||[]).includes(tf)) return false;
    if (sf==='has_yt' && !s.youtube_id) return false;
    if (sf==='no_yt' && s.youtube_id) return false;
    if (sf==='has_review' && (!s.review_en||s.review_en.length<50)) return false;
    if (sf==='no_review' && s.review_en&&s.review_en.length>=50) return false;
    return true;
  });
}

function renderTable(){
  var songs = getFiltered();
  var tbody = document.getElementById('songTableBody');
  var empty = document.getElementById('emptyState');
  document.getElementById('resultCount').textContent = '共 '+songs.length+' 首';
  
  if (songs.length===0){ tbody.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  
  tbody.innerHTML = songs.map(s=>{
    var badges = [];
    if (s.youtube_id) badges.push('<span class="badge badge-ok">YT</span>'); else badges.push('<span class="badge badge-miss">YT</span>');
    if (s.review_en&&s.review_en.length>50) badges.push('<span class="badge badge-ok">乐评</span>'); else badges.push('<span class="badge badge-warn">乐评</span>');
    if (s.cover) badges.push('<span class="badge badge-ok">封面</span>');
    var tags = (s.tags||[]).slice(0,2).map(t=>'<span class="badge badge-tag">'+t+'</span>').join('');
    return '<tr>'+
      '<td><div class="title-cell" onclick="openEdit(\''+s.id+'\')">'+escHtml(s.title)+'</div>'+
          '<div class="artist-cell" style="font-size:.75rem">'+escHtml(s.artist)+'</div></td>'+
      '<td><span style="font-size:.75rem">'+(s.genre||'-')+'</span><br>'+tags+'</td>'+
      '<td><div class="badges">'+badges.join(' ')+'</div></td>'+
      '<td><button class="btn btn-primary btn-sm" onclick="openEdit(\''+s.id+'\')">编辑</button>'+
          ' <a href="/song/'+s.id+'" target="_blank" class="btn btn-sm" style="background:var(--border);color:var(--text)">看</a></td>'+
      '</tr>';
  }).join('');
}

function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function openEdit(songId){
  var song = allSongs.find(s=>s.id===songId);
  if (!song) return;
  document.getElementById('editSongId').value = song.id;
  document.getElementById('modalTitle').textContent = '编辑: '+song.title;
  document.getElementById('deleteBtn').style.display = 'inline-block';
  // 填充表单
  var form = document.getElementById('editForm');
  ['title','artist','title_en','genre','year','youtube_id','spotify_id','netease_id','direct_audio_url','cover'].forEach(k=>{
    form.querySelector('[name="'+k+'"]').value = song[k]||'';
  });
  form.querySelector('[name="tags"]').value = (song.tags||[]).join(', ');
  form.querySelector('[name="language"]').value = song.language||'zh';
  ['review_en','review_cn','lyrics_original','lyrics_translation_en','lyrics_translation_cn_note','cultural_note'].forEach(k=>{
    form.querySelector('[name="'+k+'"]').value = song[k]||'';
  });
  document.getElementById('editModal').classList.add('active');
}

function openAdd(){
  document.getElementById('editSongId').value = '';
  document.getElementById('modalTitle').textContent = '新增歌曲';
  document.getElementById('deleteBtn').style.display = 'none';
  document.getElementById('editForm').reset();
  document.getElementById('editModal').classList.add('active');
}

function closeModal(){ document.getElementById('editModal').classList.remove('active'); }

function saveSong(e){
  e.preventDefault();
  var form = document.getElementById('editForm');
  var fd = new FormData(form);
  var songId = fd.get('song_id');
  var isNew = !songId;

  var body = new URLSearchParams();
  for (var [k,v] of fd.entries()) { if(k!=='song_id') body.append(k,v); }
  
  var url = isNew ? '/admin/add' : '/admin/edit/'+songId;
  fetch(url, {method:'POST', body:body, headers:{'Content-Type':'application/x-www-form-urlencoded'}})
    .then(r=>{ if(r.redirected) window.location.reload(); else window.location.reload(); })
    .catch(err=>{ alert('保存失败: '+err); });
  return false;
}

function deleteSong(){
  var songId = document.getElementById('editSongId').value;
  if (!songId) return;
  if (!confirm('确定删除这首歌？此操作不可撤销。')) return;
  fetch('/admin/delete/'+songId, {method:'POST'}).then(()=>window.location.reload());
}

// 关闭弹窗
document.getElementById('editModal').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });
</script>
{% endblock %}
