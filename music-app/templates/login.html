{% extends "base.html" %}
{% block title %}Admin Login — SlowBuild Music{% endblock %}
{% block content %}
<style>
.login-box{max-width:360px;margin:80px auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:32px;text-align:center}
.login-box h2{color:var(--gold);margin-bottom:20px}
.login-box input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.9rem;margin-bottom:12px;text-align:center}
.login-box button{width:100%;padding:10px;background:var(--gold);color:#000;border:none;border-radius:8px;font-weight:600;font-size:.9rem;cursor:pointer}
.error{color:#ef4444;font-size:.8rem;margin-bottom:12px}
</style>
<div class="login-box">
  <h2>🔐 Admin Login</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="POST">
    <input type="password" name="password" placeholder="Password" autofocus>
    <button type="submit">Log In</button>
  </form>
</div>
{% endblock %}
