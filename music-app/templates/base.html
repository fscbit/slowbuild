<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{% block title %}SlowBuild Music — Hand-Picked Songs, Explained{% endblock %}</title>
<meta name="description" content="{% block description %}Discover Chinese music through English reviews, lyric translations, and cultural context.{% endblock %}">
{% block og %}
<meta property="og:title" content="{% block og_title %}SlowBuild Music — Chinese Songs Explained{% endblock %}">
<meta property="og:description" content="{% block og_desc %}Discover Chinese music through English reviews, lyric translations, and cultural context.{% endblock %}">
<meta property="og:type" content="{% block og_type %}website{% endblock %}">
<meta property="og:url" content="https://music.slowbuild.top{{ request.path }}">
<meta property="og:site_name" content="SlowBuild Music">
<meta property="og:image" content="{% block og_image %}https://music.slowbuild.top/static/default-og.jpg{% endblock %}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% block tw_title %}SlowBuild Music — Chinese Songs Explained{% endblock %}">
<meta name="twitter:description" content="{% block tw_desc %}Discover Chinese music through English reviews, lyric translations, and cultural context.{% endblock %}">{% endblock %}
<link rel="canonical" href="https://music.slowbuild.top{{ request.path }}">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
{% block schema %}{% endblock %}
<style>
:root{
  --bg: #fdfaf4;
  --bg2: #f6efe2;
  --surface: #ffffff;
  --card: #fefdfb;
  --border: #e8dcc8;
  --border-light: #f0e8d5;
  --text: #3c3628;
  --text2: #6b6355;
  --muted: #9b917a;
  --gold: #b8860b;
  --gold-light: #daa520;
  --red: #c53030;
  --rose: #e07a5f;
  --jade: #5b8c7a;
  --jade-light: #81b29a;
  --ink: #2d2b26;
  --shadow: 0 1px 3px rgba(60,54,40,.06), 0 4px 16px rgba(60,54,40,.04);
  --shadow-lg: 0 2px 8px rgba(60,54,40,.08), 0 8px 32px rgba(60,54,40,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at 20% 0%, rgba(218,165,32,.03) 0%, transparent 50%),
             radial-gradient(ellipse at 80% 100%, rgba(91,140,122,.03) 0%, transparent 50%);
  pointer-events:none;z-index:0;
}
.container{max-width:1140px;margin:0 auto;padding:20px 28px;position:relative;z-index:1}
nav{
  background:rgba(255,255,255,.85);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-light);
  position:sticky;top:0;z-index:50;
  padding:0 28px;
}
nav .nav-inner{max-width:1140px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px}
nav .logo{
  font-family:'Noto Serif SC',serif;font-size:1.15rem;font-weight:600;
  color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px;
  letter-spacing:-.01em;
}
nav .logo .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);margin-right:2px}
nav .links{display:flex;gap:6px}
nav .links a{
  color:var(--text2);text-decoration:none;font-size:.78rem;font-weight:500;
  padding:6px 14px;border-radius:18px;transition:all .2s;letter-spacing:.01em;
}
nav .links a:hover{color:var(--ink);background:var(--bg2)}
.hero{text-align:center;padding:70px 20px 50px;position:relative}
.hero::after{
  content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--gold-light),transparent);
}
.hero h1{
  font-family:'Noto Serif SC',serif;font-size:2.2rem;font-weight:600;
  color:var(--ink);margin-bottom:14px;letter-spacing:-.02em;
  background:linear-gradient(135deg,var(--ink) 20%,var(--jade) 60%,var(--gold-light) 90%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.hero p{color:var(--text2);font-size:.95rem;max-width:520px;margin:0 auto;line-height:1.7}

footer{
  text-align:center;padding:50px 20px 36px;color:var(--muted);font-size:.75rem;
  border-top:1px solid var(--border-light);margin-top:60px;
}
footer a{color:var(--jade);text-decoration:none}
footer a:hover{color:var(--gold)}
.footer-line{margin-bottom:8px}
.footer-line span{font-family:'Noto Serif SC',serif;color:var(--text2);font-size:.85rem}

/* Shared components */
.section-title{
  font-family:'Noto Serif SC',serif;font-size:1.15rem;font-weight:600;
  color:var(--ink);margin:44px 0 18px;padding-bottom:10px;
  border-bottom:1px solid var(--border-light);
  display:flex;align-items:center;gap:10px;
}
.section-title::before{content:'';display:inline-block;width:4px;height:18px;background:var(--gold);border-radius:2px}
.tag{border-radius:18px;padding:2px 10px;font-size:.68rem;font-weight:500;letter-spacing:.02em}
.btn-primary{
  display:inline-flex;align-items:center;gap:6px;padding:10px 22px;
  background:var(--ink);color:#fff;border:none;border-radius:24px;
  font-size:.82rem;font-weight:600;cursor:pointer;text-decoration:none;
  transition:all .2s;letter-spacing:.01em;
}
.btn-primary:hover{background:#444;transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.btn-outline{
  display:inline-flex;align-items:center;gap:6px;padding:8px 18px;
  border:1.5px solid var(--border);border-radius:24px;color:var(--text2);
  font-size:.78rem;font-weight:500;cursor:pointer;text-decoration:none;
  transition:all .2s;background:transparent;
}
.btn-outline:hover{border-color:var(--jade);color:var(--jade)}
.admin-link{font-size:.68rem;color:var(--muted);opacity:.35;transition:opacity .3s;margin-left:8px}
.admin-link:hover{opacity:.7}
@media(max-width:768px){
  .hero h1{font-size:1.6rem}
  .container{padding:16px}
  nav{padding:0 16px}
  nav .links a{font-size:.72rem;padding:5px 10px}
}
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="/" class="logo"><span class="dot"></span>SlowBuild Music</a>
    <div class="links">
      <a href="/">Discover</a>
      <a href="/?genre=pop">Pop</a>
      <a href="/?genre=rock">Rock</a>
      <a href="/?genre=folk">Folk</a>
      <a href="/?genre=indie">Indie</a>
      <a href="/admin" class="admin-link" title="Admin">▪</a>
    </div>
  </div>
</nav>

<div class="container">{% block content %}{% endblock %}</div>

<footer>
  <div class="footer-line"><span>樂</span></div>
  <p>SlowBuild Music · Chinese songs explained · <a href="https://music.slowbuild.top">music.slowbuild.top</a></p>
</footer>

<script>
document.querySelector('.search-bar input')?.addEventListener('input', function(e){
  var q = e.target.value.toLowerCase();
  document.querySelectorAll('.song-card').forEach(function(c){
    c.style.display = c.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
});
</script>
</body>
</html>
