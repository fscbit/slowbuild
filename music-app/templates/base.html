<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{% block title %}SlowBuild Music — Chinese Songs Explained{% endblock %}</title>
<meta name="description" content="{% block description %}Discover Chinese music through English reviews, lyric translations, and cultural context. Hand-picked songs explained for a global audience.{% endblock %}">
{% block og %}
<meta property="og:title" content="{% block og_title %}SlowBuild Music — Chinese Songs Explained{% endblock %}">
<meta property="og:description" content="{% block og_desc %}Discover Chinese music through English reviews, lyric translations, and cultural context.{% endblock %}">
<meta property="og:type" content="{% block og_type %}website{% endblock %}">
<meta property="og:url" content="https://music.slowbuild.top{{ request.path }}">
<meta property="og:site_name" content="SlowBuild Music">
<meta property="og:image" content="{% block og_image %}https://music.slowbuild.top/static/default-og.jpg{% endblock %}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% block tw_title %}SlowBuild Music — Chinese Songs Explained{% endblock %}">
<meta name="twitter:description" content="{% block tw_desc %}Discover Chinese music through English reviews, lyric translations, and cultural context.{% endblock %}">{% endblock %}
<link rel="canonical" href="https://music.slowbuild.top{{ request.path }}">
{% block schema %}{% endblock %}
<style>
:root{--bg:#0a0a0f;--surface:#12121a;--border:#1e1e2e;--text:#d4d4e0;--muted:#707088;--gold:#d4a853;--teal:#38bdf8;--pink:#ec4899}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1100px;margin:0 auto;padding:20px 24px}
nav{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
nav .logo{font-size:1.3rem;font-weight:700;background:linear-gradient(135deg,#d4a853,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}
nav .links{display:flex;gap:20px}
nav .links a{color:var(--muted);text-decoration:none;font-size:.85rem;transition:color .2s}
nav .links a:hover{color:var(--text)}
.hero{text-align:center;padding:60px 20px 40px}
.hero h1{font-size:2rem;background:linear-gradient(135deg,#d4a853,#ec4899,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
.hero p{color:var(--muted);font-size:.95rem;max-width:600px;margin:0 auto}
.search-bar{max-width:500px;margin:0 auto 30px;position:relative}
.search-bar input{width:100%;padding:12px 20px;border-radius:30px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.9rem;outline:none}
.search-bar input:focus{border-color:var(--teal)}
.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:30px}
.filter-btn{padding:6px 16px;border:1px solid var(--border);border-radius:20px;background:var(--surface);color:var(--muted);font-size:.8rem;cursor:pointer;transition:all .2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--teal);color:var(--teal)}
.song-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.song-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:all .2s;display:flex;flex-direction:column}
.song-card:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:0 8px 24px rgba(56,189,248,.08)}
.song-cover{width:100%;height:200px;background:var(--code-bg);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.song-cover img{width:100%;height:100%;object-fit:cover}
.song-cover .placeholder{font-size:4rem;opacity:.3}
.song-body{padding:16px 20px;flex:1;display:flex;flex-direction:column}
.song-body h3{font-size:1rem;margin-bottom:4px}
.song-body h3 a{color:var(--text);text-decoration:none}
.song-body h3 a:hover{color:var(--teal)}
.song-body .artist{color:var(--pink);font-size:.85rem;margin-bottom:8px}
.song-body .desc{color:var(--muted);font-size:.8rem;line-height:1.5;margin-bottom:12px;flex:1}
.song-body .meta{display:flex;gap:12px;font-size:.7rem;color:var(--muted)}
.song-body .tag{color:var(--teal)}
footer{text-align:center;padding:40px 20px;color:var(--muted);font-size:.75rem;border-top:1px solid var(--border);margin-top:40px}
footer a{color:var(--teal)}
.empty{text-align:center;padding:60px;color:var(--muted)}
.admin-link{font-size:.7rem;color:var(--muted);opacity:.3;transition:opacity .3s}
.admin-link:hover{opacity:1}
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">🎵 SlowBuild Music</a>
  <div class="links">
    <a href="/">Home</a>
    <a href="/?genre=pop">Pop</a>
    <a href="/?genre=rock">Rock</a>
    <a href="/?genre=folk">Folk</a>
    <a href="/?genre=rnb">R&B</a>
    <a href="/?genre=hiphop">Hip Hop</a>
    <a href="/?genre=indie">Indie</a>
    <a href="/admin" class="admin-link" title="Admin">⚙</a>
  </div>
</nav>

<div class="container">
{% block content %}{% endblock %}
</div>

<footer>
  <p>SlowBuild Music · Chinese songs explained in English · By a native speaker in 衡水</p>
  <p><a href="https://music.slowbuild.top">music.slowbuild.top</a> · <a href="/admin">Admin</a></p>
</footer>

<script>
// Live search
document.querySelector('.search-bar input')?.addEventListener('input', function(e){
  var q = e.target.value.toLowerCase();
  document.querySelectorAll('.song-card').forEach(function(card){
    var text = card.textContent.toLowerCase();
    card.style.display = text.includes(q) ? '' : 'none';
  });
});

// Filter active state
document.querySelectorAll('.filter-btn').forEach(function(btn){
  var params = new URLSearchParams(window.location.search);
  if(params.get('genre') === btn.dataset.genre) btn.classList.add('active');
  btn.addEventListener('click', function(){
    if(btn.dataset.genre === 'all') window.location = '/';
    else window.location = '/?genre=' + btn.dataset.genre;
  });
});
</script>
</body>
</html>
