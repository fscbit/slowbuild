<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合并 CSV/Excel 工具</title>
<style>
:root{--blue:#4472C4;--bg:#f5f7fa;--card:#fff;--line:#e3e8ef;--txt:#1f2937;--sub:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:20px}
header{margin-bottom:16px}
h1{font-size:22px}h1 span{color:var(--blue)}
.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.card h2{font-size:15px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 20px;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600;background:var(--blue);color:#fff}
.btn:hover{background:#365a9c}
.btn:disabled{opacity:.5;cursor:not-allowed}
.drop{background:#fafbfd;border:2px dashed var(--line);border-radius:10px;padding:20px;text-align:center;cursor:pointer;font-size:13px;color:var(--sub)}
.drop:hover,.drop.drag{border-color:var(--blue);background:#f0f5ff}
.drop .icon{font-size:28px;display:block;margin-bottom:6px}
.status{font-size:13px;color:var(--blue);margin-top:8px;min-height:20px}
.hidden{display:none}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left}
th{background:#f4f6f9;font-weight:600}
.file-list{margin-top:8px;font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>➕ <span>合并 CSV / Excel</span>工具</h1>
    <div class="sub">上传多个文件，按列名对齐合并成一个表（列取并集）</div>
  </header>

  <div class="card">
    <h2>1. 上传多个文件</h2>
    <div class="drop" id="drop">
      <span class="icon">📚</span><span id="fileLabel">点击选择 或 拖入多个 .xlsx / .csv（可多选）</span>
      <input type="file" id="fileInput" accept=".xlsx,.xlsm,.csv" multiple class="hidden">
    </div>
    <div class="file-list" id="fileList"></div>
    <div class="status" id="status"></div>
  </div>

  <div class="card hidden" id="resultCard">
    <h2>2. 合并结果</h2>
    <table><tbody id="summary"></tbody></table>
    <div class="actions">
      <button class="btn" id="dlXlsx">下载 Excel (.xlsx)</button>
      <button class="btn" id="dlCsv">下载 CSV</button>
    </div>
  </div>
</div>

<script>
var BACKEND = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:5000' : 'https://api.slowbuild.top';
var JOB = null;

var drop = document.getElementById('drop');
var input = document.getElementById('fileInput');
drop.onclick = function(){ input.click(); };
input.onchange = function(){ if(input.files.length) upload(); };
['dragover','dragenter'].forEach(function(ev){ drop.addEventListener(ev, function(e){e.preventDefault();drop.classList.add('drag');}); });
['dragleave','drop'].forEach(function(ev){ drop.addEventListener(ev, function(e){e.preventDefault();drop.classList.remove('drag');}); });
drop.addEventListener('drop', function(e){ if(e.dataTransfer.files.length){ input.files = e.dataTransfer.files; upload(); } });

function setStatus(t){ document.getElementById('status').textContent = t; }

function upload(){
  var files = Array.from(input.files);
  document.getElementById('fileLabel').textContent = '已选 ' + files.length + ' 个文件';
  document.getElementById('fileList').innerHTML = files.map(function(f){ return '<div>📄 '+f.name+'</div>'; }).join('');
  var fd = new FormData();
  files.forEach(function(f){ fd.append('files', f); });
  setStatus('合并中...');
  fetch(BACKEND + '/api/merge/run', {method:'POST', body:fd})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.error){ setStatus('❌ ' + d.error); return; }
      JOB = d.job_id;
      var tb = document.getElementById('summary');
      tb.innerHTML = '<tr><th>文件</th><th>行数</th></tr>' +
        d.report.map(function(r){ return '<tr><td>'+r.file+'</td><td>'+r.rows+'</td></tr>'; }).join('') +
        '<tr><td><b>合计</b></td><td><b>'+d.total_rows+' 行</b></td></tr>' +
        '<tr><td><b>合并后列数</b></td><td><b>'+d.headers.length+'</b></td></tr>';
      document.getElementById('resultCard').classList.remove('hidden');
      setStatus('✅ 合并完成');
    })
    .catch(function(e){ setStatus('❌ ' + e); });
}

document.getElementById('dlXlsx').onclick = function(){ if(JOB) window.location.href = BACKEND + '/api/merge/download/' + JOB + '?fmt=xlsx'; };
document.getElementById('dlCsv').onclick = function(){ if(JOB) window.location.href = BACKEND + '/api/merge/download/' + JOB + '?fmt=csv'; };
</script>
</body>
</html>
